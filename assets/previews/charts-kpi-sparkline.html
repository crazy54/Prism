<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI + Sparkline</title><style>:root{--bg:#0a0c12;--panel:#10131c;--panel2:#171a25;--card:#12151f;--line:#252834;--ink:#f0f0f5;--muted:#a2a4b4;--dim:#8a8c9d;--accent:#b8a2f2;--accent-rgb:184,162,242;--accent2:#a8b9fc;--info:#86bdf9;--info-rgb:134,189,249;--pos:#8bd8ba;--pos-rgb:139,216,186;--warn:#eec36f;--warn-rgb:238,195,111;--neg:#f5877f;--neg-rgb:245,135,127;--crit:#f07fb3;--crit-rgb:240,127,179;--cardgrad:linear-gradient(157deg,rgba(184,162,242,.07),rgba(184,162,242,0) 55%);--font:Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--elev-1:inset 0 1px 0 rgba(255,255,255,.055),0 1px 2px rgba(0,0,0,.35);--elev-2:inset 0 1px 0 rgba(255,255,255,.1),0 18px 40px -18px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.3);--dur:0.24s;--ease:cubic-bezier(.16,1,.3,1);--bd:1px;--head-w:650;--dens:1}.c-crit{--c:var(--crit);--c-rgb:var(--crit-rgb)}.c-neg{--c:var(--neg);--c-rgb:var(--neg-rgb)}.c-warn{--c:var(--warn);--c-rgb:var(--warn-rgb)}.c-pos{--c:var(--pos);--c-rgb:var(--pos-rgb)}.c-info{--c:var(--info);--c-rgb:var(--info-rgb)}.c-accent{--c:var(--accent);--c-rgb:var(--accent-rgb)}:root{--gray:#72869f;--orange:var(--accent);--red:#f85149;--blue:var(--info);--green:var(--pos);--purple:var(--crit)}:root{color-scheme:dark;--preview-bg:#0a0c12}*{box-sizing:border-box}html,body{background:var(--preview-bg)}body{margin:0;min-height:220px;display:flex;align-items:center;justify-content:center;padding:22px;font-family:system-ui,sans-serif;color:var(--ink)}.panel{min-width:215px}.ptitle{padding-left:0!important}.atom{width:145px;height:145px}.kpi{background:var(--card);background-image:var(--cardgrad);border:1px solid var(--line);border-radius:12px;padding:16px 20px;min-width:150px}
.kpi .l{font-family:ui-monospace,Menlo,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kpi .n{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease-out forwards}
@media(prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0}}
@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}</style></head><body><div class="kpi" style="min-width:180px"><div class="l">On-Demand spend</div><div class="n">$48.2K</div>
        <svg role="img" aria-label="On-Demand spend $48.2K: line rising, highest at the latest point" width="170" height="34" viewBox="0 0 170 34" style="margin-top:8px;overflow:visible">
          <polyline class="draw" style="--len:260" points="2,26 20,22 38,28 56,16 74,20 92,10 110,14 128,7 146,12 168,4" fill="none" stroke="var(--neg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
          <circle cx="168" cy="4" r="3.2" fill="var(--neg)"></circle>
        </svg>
      </div></body></html>
