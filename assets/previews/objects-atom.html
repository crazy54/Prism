<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atom</title><style>:root{--bg:#0a0c12;--panel:#10131c;--panel2:#171a25;--card:#12151f;--line:#252834;--ink:#f0f0f5;--muted:#a2a4b4;--dim:#8a8c9d;--accent:#b8a2f2;--accent-rgb:184,162,242;--accent2:#a8b9fc;--info:#86bdf9;--info-rgb:134,189,249;--pos:#8bd8ba;--pos-rgb:139,216,186;--warn:#eec36f;--warn-rgb:238,195,111;--neg:#f5877f;--neg-rgb:245,135,127;--crit:#f07fb3;--crit-rgb:240,127,179;--cardgrad:linear-gradient(157deg,rgba(184,162,242,.07),rgba(184,162,242,0) 55%);--font:Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--elev-1:inset 0 1px 0 rgba(255,255,255,.055),0 1px 2px rgba(0,0,0,.35);--elev-2:inset 0 1px 0 rgba(255,255,255,.1),0 18px 40px -18px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.3);--dur:0.24s;--ease:cubic-bezier(.16,1,.3,1);--bd:1px;--head-w:650;--dens:1}.c-crit{--c:var(--crit);--c-rgb:var(--crit-rgb)}.c-neg{--c:var(--neg);--c-rgb:var(--neg-rgb)}.c-warn{--c:var(--warn);--c-rgb:var(--warn-rgb)}.c-pos{--c:var(--pos);--c-rgb:var(--pos-rgb)}.c-info{--c:var(--info);--c-rgb:var(--info-rgb)}.c-accent{--c:var(--accent);--c-rgb:var(--accent-rgb)}:root{--gray:#72869f;--orange:var(--accent);--red:#f85149;--blue:var(--info);--green:var(--pos);--purple:var(--crit)}:root{color-scheme:dark;--preview-bg:#0a0c12}*{box-sizing:border-box}html,body{background:var(--preview-bg)}body{margin:0;min-height:220px;display:flex;align-items:center;justify-content:center;padding:22px;font-family:system-ui,sans-serif;color:var(--ink)}.panel{min-width:215px}.ptitle{padding-left:0!important}.atom{width:145px;height:145px}.atom .nuc{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.atom .e{animation:orbitMove linear infinite}
.atom .e1{offset-path:path('M 59,59 m -40,0 a 40,15 0 1,0 80,0 a 40,15 0 1,0 -80,0');animation-duration:2.6s}
.atom .e2{offset-path:path('M 59,59 m -40,0 a 40,15 0 1,0 80,0 a 40,15 0 1,0 -80,0');animation-duration:3.4s;animation-delay:-1.2s}
.atom .e3{offset-path:path('M 59,59 m -40,0 a 40,15 0 1,0 80,0 a 40,15 0 1,0 -80,0');animation-duration:3s;animation-delay:-2.1s}
.atom .o2{transform-box:view-box;transform-origin:59px 59px;transform:rotate(60deg)}
.atom .o3{transform-box:view-box;transform-origin:59px 59px;transform:rotate(120deg)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes orbitMove{to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}</style></head><body><svg viewBox="0 0 118 118" class="atom" fill="none">
        <ellipse cx="59" cy="59" rx="40" ry="15" stroke="var(--gray)" stroke-width="2"></ellipse>
        <ellipse class="o2" cx="59" cy="59" rx="40" ry="15" stroke="var(--gray)" stroke-width="2"></ellipse>
        <ellipse class="o3" cx="59" cy="59" rx="40" ry="15" stroke="var(--gray)" stroke-width="2"></ellipse>
        <circle class="nuc" cx="59" cy="59" r="9" fill="var(--orange)"></circle>
        <circle class="e e1" r="4.5" fill="var(--red)"></circle>
        <g class="o2"><circle class="e e2" r="4.5" fill="var(--red)"></circle></g>
        <g class="o3"><circle class="e e3" r="4.5" fill="var(--red)"></circle></g>
      </svg></body></html>
