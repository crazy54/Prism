<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atom</title><style>:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}:root{--gray:#72869f;--orange:var(--accent);--red:#f85149;--blue:var(--info);--green:var(--pos);--purple:var(--crit)}*{box-sizing:border-box}body{margin:0;min-height:220px;display:flex;align-items:center;justify-content:center;padding:22px;font-family:system-ui,sans-serif;color:var(--ink);background:transparent}.panel{min-width:215px}.ptitle{padding-left:0!important}.atom{width:145px;height:145px}.atom .nuc { transform-box: fill-box; transform-origin: center center; animation: 1.6s ease-in-out 0s infinite normal none running pulse; }
.atom .e { animation: auto linear 0s infinite normal none running orbitMove; }
.atom .e1 { offset-path: path("M 59 59 m -40 0 a 40 15 0 1 0 80 0 a 40 15 0 1 0 -80 0"); animation-duration: 2.6s; }
.atom .e2 { offset-path: path("M 59 59 m -40 0 a 40 15 0 1 0 80 0 a 40 15 0 1 0 -80 0"); animation-duration: 3.4s; animation-delay: -1.2s; }
.atom .e3 { offset-path: path("M 59 59 m -40 0 a 40 15 0 1 0 80 0 a 40 15 0 1 0 -80 0"); animation-duration: 3s; animation-delay: -2.1s; }
.atom .o2 { transform-box: view-box; transform-origin: 59px 59px; transform: rotate(60deg); }
.atom .o3 { transform-box: view-box; transform-origin: 59px 59px; transform: rotate(120deg); }
@keyframes pulse { 
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
@keyframes orbitMove { 
  100% { offset-distance: 100%; }
}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}</style></head><body><svg viewBox="0 0 118 118" class="atom" fill="none">
        <ellipse cx="59" cy="59" rx="40" ry="15" stroke="var(--gray)" stroke-width="2"></ellipse>
        <ellipse class="o2" cx="59" cy="59" rx="40" ry="15" stroke="var(--gray)" stroke-width="2"></ellipse>
        <ellipse class="o3" cx="59" cy="59" rx="40" ry="15" stroke="var(--gray)" stroke-width="2"></ellipse>
        <circle class="nuc" cx="59" cy="59" r="9" fill="var(--orange)"></circle>
        <circle class="e e1" r="4.5" fill="var(--red)"></circle>
        <g class="o2"><circle class="e e2" r="4.5" fill="var(--red)"></circle></g>
        <g class="o3"><circle class="e e3" r="4.5" fill="var(--red)"></circle></g>
      </svg></body></html>
