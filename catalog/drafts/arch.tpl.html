<script type="text/html" id="pg-arch"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺 Architecture Diagrams · Prism</title>
<style>
:root{
  --bg:#0b0e17; --panel:#121623; --panel2:#171d2e; --card:#141b2b; --line:#243049;
  --ink:#eaf1f9; --muted:#8593a8; --dim:#5b6678;
  --crit:#c879ff;  --crit-rgb:200,121,255;
  --neg:#f85149;   --neg-rgb:248,81,73;
  --warn:#e0a52b;  --warn-rgb:224,165,43;
  --pos:#3fb950;   --pos-rgb:63,185,80;
  --info:#4493f8;  --info-rgb:68,147,248;
  --accent:#ff9900;--accent-rgb:255,153,0;
  --cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%);
}
.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}
.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}
.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(255,153,0,.05),transparent 60%),var(--bg);
  color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:90px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.head{padding:28px 32px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#232f3e,var(--panel));position:relative}
.head h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em}
.head p{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:820px}
.wrap{max-width:1240px;margin:0 auto;padding:22px 32px 0}
h3.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile .stage{padding:26px 18px;min-height:130px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 10px,transparent 10px 20px);position:relative}
.tile .meta{padding:12px 14px;border-top:1px solid var(--line)}
.tile .nm{font-weight:700;font-size:13.5px}
.tile .ref{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--accent);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block;margin-top:6px}
.tile .desc{color:var(--muted);font-size:12px;margin-top:8px}
.tile .row{display:flex;gap:8px;margin-top:10px}
.tile .copy{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.tile .copy:hover{border-color:var(--accent);color:var(--accent)}
.tile .copy.ok{border-color:var(--pos);color:var(--pos)}
.el-pill{display:inline-block;background:rgba(var(--c-rgb),.14);color:var(--c);border-radius:11px;padding:3px 10px;font-size:11px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
<style id="arch-styles">
/* ================= Architecture Diagrams gallery — prefix arch- / arch* =================
   Cloud/AWS-flavored, report-grade diagram building blocks. Fully self-contained, offline.
   Colour comes ONLY from design tokens. Nodes carry two inline custom props so every
   family can be recoloured: --ac (a token colour) and --acr (its matching -rgb triplet),
   e.g. style="--ac:var(--info);--acr:var(--info-rgb)". Both default to --info.
   No selector references .tile or :hover for load-bearing styling (copy-helper friendly). */

/* ---- shared primitives ---- */
.arch-svg{display:block;width:100%;height:100%;overflow:visible;font:700 9px ui-sans-serif,system-ui,sans-serif}
.arch-svg text{fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.arch-cap{margin-top:8px;font:600 9.5px/1.3 ui-sans-serif,system-ui,sans-serif;color:var(--muted);text-align:center;letter-spacing:.02em}
.arch-lbl{font:700 10px/1.1 ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:.03em;text-align:center}

/* ---- shared keyframes ---- */
@keyframes archGlow{0%,100%{box-shadow:0 0 0 rgba(var(--acr,var(--info-rgb)),0),0 1px 0 rgba(0,0,0,.22)}50%{box-shadow:0 0 15px rgba(var(--acr,var(--info-rgb)),.4),0 1px 0 rgba(0,0,0,.22)}}
@keyframes archPulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
@keyframes archDash{to{stroke-dashoffset:-32}}
@keyframes archPacket{0%{left:2%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:97%;opacity:0}}
@keyframes archPacketV{0%{top:4%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:92%;opacity:0}}
@keyframes archSpin{to{transform:rotate(360deg)}}
@keyframes archBreath{0%,100%{box-shadow:0 0 0 rgba(var(--acr,var(--info-rgb)),0)}50%{box-shadow:0 0 18px rgba(var(--acr,var(--info-rgb)),.2)}}
@keyframes archLight{0%,72%,100%{background:var(--card);border-color:var(--line);color:var(--muted)}12%,40%{background:rgba(var(--pos-rgb),.2);border-color:var(--pos);color:var(--ink);box-shadow:0 0 12px rgba(var(--pos-rgb),.4)}}
@keyframes archMsg{0%{transform:translateX(64px);opacity:0}18%,82%{opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes archScan{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes archBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ======================================================================
   1 — SERVICE NODES
   ====================================================================== */
.arch-node{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:2px}
.arch-ico{position:relative;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:800;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ac,var(--info));background:linear-gradient(160deg,rgba(var(--acr,var(--info-rgb)),.2),rgba(var(--acr,var(--info-rgb)),.08));border:1px solid rgba(var(--acr,var(--info-rgb)),.55);animation:archGlow 3.4s ease-in-out infinite}
.arch-node .arch-lbl{max-width:88px}

/* status dot node */
.arch-nstat{position:relative}
.arch-nstat .arch-sdot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--pos);border:2px solid var(--panel);box-shadow:0 0 9px var(--pos);animation:archPulse 1.9s ease-in-out infinite}

/* lambda / compute node — hexagon-ish rounded */
.arch-lambda .arch-ico{border-radius:12px;font-size:20px}

/* storage bucket node */
.arch-bucket .arch-ico{border-radius:6px 6px 12px 12px}
.arch-bucket .arch-ico::after{content:"";position:absolute;width:44px;height:8px;margin-top:-24px;border-radius:6px 6px 0 0;background:rgba(var(--acr,var(--info-rgb)),.35)}

/* database cylinder (pure CSS) */
.arch-dbcyl{position:relative;width:52px;height:56px;margin-top:8px;border:1px solid rgba(var(--acr,var(--info-rgb)),.6);border-top:none;border-radius:0 0 26px 26px/0 0 14px 14px;background:linear-gradient(180deg,rgba(var(--acr,var(--info-rgb)),.22),rgba(var(--acr,var(--info-rgb)),.08));display:grid;place-items:center;color:var(--ac,var(--info));font:800 12px/1 ui-sans-serif,system-ui,sans-serif;animation:archGlow 3.6s ease-in-out infinite}
.arch-dbcyl::before{content:"";position:absolute;left:-1px;right:-1px;top:-8px;height:15px;border-radius:50%;background:rgba(var(--acr,var(--info-rgb)),.32);border:1px solid rgba(var(--acr,var(--info-rgb)),.6)}
.arch-dbcyl::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-8px;height:15px;border-radius:50%;border:1px solid rgba(var(--acr,var(--info-rgb)),.6);border-top:none;background:rgba(var(--acr,var(--info-rgb)),.1)}

/* queue node — stack of messages, one flowing in */
.arch-qbox{position:relative;display:flex;gap:3px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
.arch-qbox .arch-qm{width:11px;height:22px;border-radius:2px;background:linear-gradient(180deg,rgba(var(--warn-rgb),.7),rgba(var(--warn-rgb),.35));border:1px solid rgba(var(--warn-rgb),.6)}
.arch-qbox .arch-qm.arch-qin{animation:archMsg 2.4s ease-in-out infinite}

/* CDN node — globe rings */
.arch-cdn .arch-ico{position:relative;border-radius:50%}
.arch-cdn .arch-ico::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(var(--acr,var(--info-rgb)),.5)}
.arch-cdn .arch-ico::after{content:"";position:absolute;inset:6px 16px;border-radius:50%;border:1px solid rgba(var(--acr,var(--info-rgb)),.5)}

/* client / user node */
.arch-client .arch-ico{border-radius:50% 50% 12px 12px}

/* internet gateway node — dashed diamond */
.arch-igw .arch-ico{border-radius:10px;transform:rotate(45deg);border-style:dashed}
.arch-igw .arch-ico span{transform:rotate(-45deg)}

/* API gateway node */
.arch-api .arch-ico{border-radius:10px}

/* ======================================================================
   2 — CONNECTORS & FLOWS
   ====================================================================== */
/* straight animated flowing dash */
.arch-conn{position:relative;width:190px;height:20px}
.arch-conn .arch-svg .arch-ln{stroke:var(--line);stroke-width:2;fill:none}
.arch-conn .arch-svg .arch-flow{stroke:var(--info);stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:7 7;animation:archDash 1.1s linear infinite}
.arch-arw{fill:var(--info)}
.arch-arw2{fill:var(--muted)}

/* labeled connector */
.arch-clabel{position:absolute;left:50%;top:-9px;transform:translateX(-50%);padding:1px 7px;font:800 8px/1.5 ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;color:var(--info);background:rgba(var(--info-rgb),.14);border:1px solid rgba(var(--info-rgb),.4);border-radius:20px}

/* data-packet dot travelling a wire */
.arch-track{position:relative;width:200px;height:22px;display:flex;align-items:center}
.arch-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.arch-pkt{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 11px var(--accent);animation:archPacket 2.2s linear infinite}
.arch-pkt.arch-pkt2{background:var(--info);box-shadow:0 0 11px var(--info);animation-delay:1.1s}

/* inline flow connector used inside mini-diagrams (horizontal) */
.arch-hop{position:relative;flex:1;min-width:20px;align-self:center;height:2px;background:var(--line)}
.arch-hop::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid var(--line)}
.arch-hop::before{content:"";position:absolute;top:50%;left:0;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--info);box-shadow:0 0 8px var(--info);animation:archPacket 1.9s linear infinite}

/* ======================================================================
   3 — CONTAINERS & BOUNDARIES
   ====================================================================== */
.arch-box{position:relative;padding:24px 14px 12px;border:1.5px solid rgba(var(--acr,var(--info-rgb)),.55);border-radius:11px;background:rgba(var(--acr,var(--info-rgb)),.055);animation:archBreath 4.4s ease-in-out infinite}
.arch-box.arch-dashed{border-style:dashed}
.arch-tag{position:absolute;top:-1px;left:-1px;padding:2px 9px;font:800 8px/1.5 ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;color:var(--ac,var(--info));background:rgba(var(--acr,var(--info-rgb)),.18);border:1px solid rgba(var(--acr,var(--info-rgb)),.4);border-radius:10px 0 10px 0}
.arch-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.arch-col{display:flex;flex-direction:column;gap:8px;align-items:center}

/* security-group ring */
.arch-sgwrap{position:relative;width:118px;height:118px;display:grid;place-items:center}
.arch-sgring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(var(--pos-rgb),.6);animation:archSpin 16s linear infinite}
.arch-sgring.arch-sgring2{inset:14px;border-color:rgba(var(--info-rgb),.5);animation-direction:reverse;animation-duration:22s}

/* ======================================================================
   4 — FULL MINI-DIAGRAMS  (chips + hops)
   ====================================================================== */
.arch-chip{display:inline-flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.arch-chip .arch-ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:800 12px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ac,var(--info));background:linear-gradient(160deg,rgba(var(--acr,var(--info-rgb)),.2),rgba(var(--acr,var(--info-rgb)),.08));border:1px solid rgba(var(--acr,var(--info-rgb)),.55)}
.arch-chip .arch-ct{font:700 8.5px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:.02em}
.arch-flowrow{display:flex;align-items:flex-start;gap:0;width:100%;max-width:330px}
.arch-flowrow .arch-hop{margin-top:16px}

/* CI/CD stages that light up in sequence */
.arch-pipe{display:flex;gap:8px;align-items:center}
.arch-pstage{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);font:800 9px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.03em;animation:archLight 4.4s ease-in-out infinite}
.arch-pstage:nth-child(2){animation-delay:.55s}
.arch-pstage:nth-child(3){animation-delay:1.1s}
.arch-pstage:nth-child(4){animation-delay:1.65s}
.arch-pstage:nth-child(5){animation-delay:2.2s}
.arch-psep{color:var(--dim);font-weight:800}

/* load-balancer fan / branch / multi-AZ use inline SVG (styles below) */
.arch-dnode{fill:var(--card);stroke:rgba(var(--info-rgb),.7);stroke-width:1.4}
.arch-dnode.arch-pos{stroke:var(--pos)}
.arch-dnode.arch-warn{stroke:var(--warn)}
.arch-dnode.arch-neg{stroke:var(--neg)}
.arch-dedge{stroke:var(--line);stroke-width:1.6;fill:none}
.arch-dflow{stroke:rgba(var(--info-rgb),.9);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-dasharray:5 6;animation:archDash 1.2s linear infinite}

/* ======================================================================
   5 — SEQUENCE & FLOW DIAGRAMS  (mostly SVG)
   ====================================================================== */
.arch-life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 4}
.arch-actor{fill:var(--card);stroke:var(--info);stroke-width:1.4}
.arch-msgln{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-dasharray:80;stroke-dashoffset:80;animation:archDraw 3.2s ease-in-out infinite}
.arch-msgln.arch-m2{stroke:var(--info);animation-delay:1.1s}
.arch-msgln.arch-m3{stroke:var(--pos);animation-delay:2.1s}
@keyframes archDraw{0%{stroke-dashoffset:80}30%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:1}}
.arch-diamond{fill:rgba(var(--warn-rgb),.14);stroke:var(--warn);stroke-width:1.4}
.arch-state{fill:rgba(var(--info-rgb),.13);stroke:var(--info);stroke-width:1.4}
.arch-state.arch-active{fill:rgba(var(--pos-rgb),.2);stroke:var(--pos);animation:archBreathS 3s ease-in-out infinite}
@keyframes archBreathS{0%,100%{filter:drop-shadow(0 0 0 rgba(var(--pos-rgb),0))}50%{filter:drop-shadow(0 0 6px rgba(var(--pos-rgb),.7))}}

/* swimlanes */
.arch-lanes{display:flex;flex-direction:column;gap:0;width:100%;max-width:320px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.arch-lane{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.arch-lane:last-child{border-bottom:none}
.arch-lane .arch-lhdr{flex:0 0 52px;font:800 8px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.arch-lane .arch-ltrack{position:relative;flex:1;height:14px;display:flex;align-items:center}
.arch-lane .arch-ltrack::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.arch-lstep{position:relative;z-index:1;padding:2px 7px;border-radius:6px;font:800 8px/1.3 ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid rgba(var(--info-rgb),.55)}
.arch-ltrack .arch-lpkt{position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:archPacket 3s linear infinite}

/* ======================================================================
   6 — TOPOLOGY & GRAPH  (SVG)
   ====================================================================== */
.arch-tnode{fill:rgba(var(--info-rgb),.16);stroke:var(--info);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:archPulse 3.2s ease-in-out infinite}
.arch-tnode.arch-hub{fill:rgba(var(--accent-rgb),.2);stroke:var(--accent)}
.arch-tnode.arch-pos{fill:rgba(var(--pos-rgb),.18);stroke:var(--pos)}
.arch-tnode.arch-warn{fill:rgba(var(--warn-rgb),.18);stroke:var(--warn)}
.arch-tnode.arch-neg{fill:rgba(var(--neg-rgb),.18);stroke:var(--neg)}
.arch-tnode.arch-d2{animation-delay:.5s}
.arch-tnode.arch-d3{animation-delay:1s}
.arch-tnode.arch-d4{animation-delay:1.5s}
.arch-tnode.arch-d5{animation-delay:2s}
.arch-tedge{stroke:var(--line);stroke-width:1.4;fill:none}
.arch-tflow{stroke:rgba(var(--info-rgb),.75);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-dasharray:4 6;animation:archDash 1.3s linear infinite}
.arch-tflow.arch-pos{stroke:rgba(var(--pos-rgb),.85)}
.arch-tflow.arch-warn{stroke:rgba(var(--warn-rgb),.85)}
.arch-tflow.arch-neg{stroke:rgba(var(--neg-rgb),.85)}

/* ring topology token orbiting */
.arch-ringwrap{position:relative;width:130px;height:130px}
.arch-ringwrap .arch-rspin{position:absolute;inset:0;animation:archSpin 6s linear infinite}
.arch-ringwrap .arch-rtoken{position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

</style>
</head>
<body>
<div class="head">
  <h1>🗺 Architecture Diagrams</h1>
  <p>Cloud/AWS-flavored diagram building blocks — service nodes, animated connectors, VPC/subnet containers, full mini-architectures, sequence & flow diagrams and network topologies. Pure SVG + CSS.</p>
</div>
<div class="wrap">
<h3 class="sec">SERVICE NODES</h3>
<div class="gallery">

  <div class="tile is-new"><div class="stage">
    <div class="arch-node arch-api" style="--ac:var(--info);--acr:var(--info-rgb)">
      <div class="arch-ico"><span>API</span></div>
      <div class="arch-lbl">API Gateway</div>
    </div>
  </div><div class="meta"><div class="nm">Service Node</div><span class="ref">.arch-node</span><div class="desc">A labelled service node: an icon box plus a name, glowing gently at idle. The base building block for any AWS-style diagram.</div><button class="copy" onclick="copyViz(this)">Copy</button></div></div>

  <div class="tile is-new"><div class="stage">
    <div class="arch-node arch-nstat" style="--ac:var(--pos);--acr:var(--pos-rgb)">
      <div class="arch-ico"><span>EC2</span><span class="arch-sdot"></span></div>
      <div class="arch-lbl">Web Server</div>
    </div>
  </div><div class="meta"><div class="nm">Node with Status Dot</div><span class="ref">.arch-nstat</span><div class="desc">A service node with a pulsing health dot in the corner — use it to show a component is live and healthy.</div><button class="copy" onclick="copyViz(this)">Copy</button></div></div>

  <div class="tile is-new"><div class="stage">
    <div class="arch-node arch-lambda" style="--ac:var(--accent);--acr:var(--accent-rgb)">
      <div class="arch-ico"><span>&lambda;</span></div>
      <div class="arch-lbl">Lambda Function</div>
    </div>
  </div><div class="meta"><div class="nm">Compute / Lambda Node</div><span class="ref">.arch-lambda</span><div class="desc">A serverless compute node marked with the lambda glyph, tinted in the accent colour. Drop it wherever a function runs.</div><button class="copy" onclick="copyViz(this)">Copy</button></div></div>

  <div class="tile is-new"><div class="stage">
    <div class="arch-node arch-bucket" style="--ac:var(--pos);--acr:var(--pos-rgb)">
      <div class="arch-ico"><span>S3</span></div>
      <div class="arch-lbl">Object Store</div>
    </div>
  </div><div class="meta"><div class="nm">Storage / Bucket Node</div><span class="ref">.arch-bucket</span><div class="desc">An object-storage node with a lidded-bucket silhouette for S3-style buckets and data lakes.</div><button class="copy" onclick="copyViz(this)">Copy</button></div></div>

  <div class="tile is-new"><div class="stage">
    <div class="arch-node" style="--ac:var(--crit);--acr:var(--crit-rgb)">
      <div class="arch-dbcyl">DB</div>
      <div class="arch-lbl">Database</div>
    </div>
  </div><div class="meta"><div class="nm">Database Cylinder</div><span class="ref">.arch-dbcyl</span><div class="desc">A pure-CSS database cylinder with rounded top and bottom caps — the classic datastore icon, no image needed.</div><button class="copy" onclick="copyViz(this)">Copy</button></div></div>

  <div class="tile is-new"><div class="stage">
    <div class="arch-node" style="--ac:var(--warn);--acr:var(--warn-rgb)">
      <div class="arch-qbox">

<script>
function copyViz(btn){
  var stage=btn.closest('.tile').querySelector('.stage');
  var html=stage.innerHTML.replace(/\s+$/,'').trim();
  var usedClasses=new Set();
  (html.match(/class="[^"]*"/g)||[]).forEach(function(m){m.replace(/class="/,'').replace(/"/,'').split(/\s+/).forEach(function(c){if(c)usedClasses.add(c)})});
  var cssRules=[];
  try{var sheets=document.styleSheets;for(var s=0;s<sheets.length;s++){var rules=sheets[s].cssRules;for(var r=0;r<rules.length;r++){var rule=rules[r];if(rule.type===7&&html.indexOf(rule.name)!==-1){cssRules.push(rule.cssText)}if(rule.type===1&&rule.selectorText){for(var uc of usedClasses){if(rule.selectorText.indexOf('.'+uc)!==-1&&!rule.selectorText.includes('.tile')){cssRules.push(rule.cssText);break}}}}}}catch(e){}
  cssRules=[...new Set(cssRules)];
  var output='<!-- Prism Component -->\n'+html;
  if(cssRules.length>0)output+='\n\n<style>\n'+cssRules.join('\n')+'\n</style>';
  function sgCopy(txt){try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).catch(function(){return sgCopyFallback(txt);});}}catch(e){}return Promise.resolve(sgCopyFallback(txt));}
  function sgCopyFallback(txt){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,txt.length);}catch(e){}var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(!ok)return Promise.reject(new Error('copy failed'));return true;}
  sgCopy(output).then(function(){var o=btn.dataset.lbl||btn.textContent;btn.dataset.lbl=o;btn.textContent='✓ Copied';btn.classList.add('ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');btn.removeAttribute('data-lbl');},1300);},function(){var o=btn.dataset.lbl||btn.textContent;btn.dataset.lbl=o;btn.textContent='✗ Press ⌘C';btn.classList.add('ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');btn.removeAttribute('data-lbl');},1500);});
}
/* data-snip copy for snippet buttons */
document.addEventListener('click',function(e){var b=e.target.closest('.copy[data-snip]');if(!b)return;var t=b.getAttribute('data-snip');
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);}
  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).catch(fb):Promise.resolve(fb()));
  var o=b.dataset.lbl||b.textContent;b.dataset.lbl=o;b.textContent='✓ Copied';b.classList.add('ok');setTimeout(function(){b.textContent=o;b.classList.remove('ok');},1300);
});
<\/script>
</body>
</html>
</script>
