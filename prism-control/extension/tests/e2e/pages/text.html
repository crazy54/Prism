<!doctype html>
<html><head><meta charset="utf-8"><title>(2) Text fixture</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; } p { height: 200px; margin: 0; }</style></head>
<body>
<!-- A long page with NO media: the page dial must scroll it (review HIGH 3). -->
<script>for (let i = 0; i < 40; i++) { const p = document.createElement('p'); p.textContent = 'Fixture paragraph ' + (i + 1); document.body.append(p); }</script>
</body></html>
